name: APK de teste

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    name: Gerar APK debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Preparar APK
        id: apk
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME="CicloLivre-${VERSION}-teste-${GITHUB_RUN_NUMBER}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Guardar como artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ steps.apk.outputs.name }}

      - name: Publicar release com o APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK de teste ${{ github.run_number }} (v${{ steps.apk.outputs.version }})
          body: |
            APK de **debug** gerado automaticamente a partir da `main` no commit ${{ github.sha }}.

            Baixe o arquivo `.apk` abaixo e instale no Android (é preciso permitir "instalar de fontes desconhecidas").

            Link direto para o APK mais recente: https://github.com/${{ github.repository }}/releases/latest
          files: ${{ steps.apk.outputs.name }}
          make_latest: true
